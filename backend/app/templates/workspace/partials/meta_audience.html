<article class="workspace-card">
    <h3>Meta Audience</h3>

    <p>
        Primary Meta Ads audience for this release.
    </p>

    <ul class="audience-family-list">

        {% for audience in meta_audiences %}

            <li>
                {% if release.meta_audience_id == audience.id %}
                    <strong>✓ {{ audience.name }}</strong>
                {% else %}
                    {{ audience.name }}
                {% endif %}
            </li>

        {% endfor %}

    </ul>
</article>
