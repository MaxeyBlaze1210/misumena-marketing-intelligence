<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ playlist.name }} — Misumena</title>

    <link
        rel="stylesheet"
        href="/static/css/landing.css"
    >

    {% if meta_pixel_id %}
    <script>
        !function(f,b,e,v,n,t,s)
        {
            if(f.fbq)return;

            n=f.fbq=function(){
                n.callMethod
                    ? n.callMethod.apply(n,arguments)
                    : n.queue.push(arguments);
            };

            if(!f._fbq)f._fbq=n;

            n.push=n;
            n.loaded=!0;
            n.version='2.0';
            n.queue=[];

            t=b.createElement(e);
            t.async=!0;
            t.src=v;

            s=b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t,s);

        }(
            window,
            document,
            'script',
            'https://connect.facebook.net/en_US/fbevents.js'
        );

        fbq('init', '{{ meta_pixel_id }}');
        fbq('track', 'PageView');
    </script>
    {% endif %}
</head>

<body>
    {% set artwork = '/static/images/this-is-misumena.png'
        if playlist.id == 1 else playlist.artwork_url %}


    {% if artwork %}
    <div
        class="artwork-background"
        style="background-image:url('{{ artwork }}');"
    ></div>
    {% endif %}

    <div class="background-shade"></div>

    <main class="page">

        <section class="release-card">

            {% if artwork %}
            <img
                class="cover"
                src="{{ artwork }}"
                alt="{{ playlist.name }} artwork"
            >
            {% endif %}

            <div class="release-info">

                <p class="description">
                    The essential tracks, all in one playlist.
                </p>

                <div class="services">

                    <a
                        class="service-link"
                        id="spotify-outbound-link" href="/p/{{ playlist.id }}/go/spotify"
                        data-platform="spotify"
                    >

                        <span class="service-identity">

                            <span class="service-mark spotify-mark">
                                ●
                            </span>

                            <span>Spotify</span>

                        </span>

                        <span class="service-action">
                            Listen
                            <span class="chevron">›</span>
                        </span>

                    </a>

                </div>

            </div>

        </section>

    </main>


<script>
(() => {
    const link = document.getElementById("spotify-outbound-link");
    if (!link) return;

    link.addEventListener("click", (event) => {
        // Preserve modified clicks / new-tab behaviour.
        if (
            event.button !== 0 ||
            event.metaKey ||
            event.ctrlKey ||
            event.shiftKey ||
            event.altKey
        ) {
            return;
        }

        event.preventDefault();

        const destination = link.href;
        let redirected = false;

        const goToSpotify = () => {
            if (redirected) return;
            redirected = true;
            window.location.assign(destination);
        };

        try {
            if (typeof fbq === "function") {
                fbq(
                    "trackCustom",
                    "SpotifyOutbound",
                    {
                        playlist_id: "{{ playlist.spotify_playlist_id }}"
                    }
                );

                // Give the browser pixel a brief opportunity to send
                // before handing the user to Spotify.
                window.setTimeout(goToSpotify, 350);
            } else {
                goToSpotify();
            }
        } catch (error) {
            goToSpotify();
        }
    });
})();
</script>

</body>
</html>
